<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CargoConnect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">

  <main class="login-caixa">
    <h1 class="logo">CargoConnect</h1>
    <p class="login-subtitulo">Acesse o sistema de gestão de galpões</p>

    <form class="formulario" action="{{ url_for('login') }}" method="post">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      {% if erro %}
      <p class="mensagem-erro">{{ erro }}</p>
      {% endif %}

      <button type="submit" class="botao botao-principal">Entrar</button>
    </form>

    <p class="login-aviso">Acesso restrito a usuários autorizados.</p>
  </main>

</body>
</html>
